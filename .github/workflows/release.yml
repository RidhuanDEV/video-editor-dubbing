name: Release

# Builds installers for Windows and Linux (macOS pending, see below) on a version tag and attaches them to a
# draft GitHub release.
#
# The pinned LGPL FFmpeg sidecar (release "ffmpeg-8.1-lgpl") is downloaded, checksum-verified
# and bundled. Update artifacts are signed with the updater key (secrets TAURI_SIGNING_PRIVATE_KEY
# and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and latest.json is attached for the in-app updater.
# Decisions (ADR D6): no Authenticode/Apple code signing (open-source project without budget),
# so Windows SmartScreen asks for confirmation on first install. macOS joins the matrix once
# ffmpeg-macos.yml has produced a pinned build.
#
# Publishing: the release is created as a draft. The in-app updater reads
# releases/latest/download/latest.json, which resolves only after the owner publishes the draft.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: FFmpeg sidecar (pinned, checksum-verified)
        run: node scripts/fetch-ffmpeg.mjs
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Turns on updater artifacts (.sig + latest.json) only for CI releases.
          args: --config src-tauri/tauri.updater.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Script Studio ${{ github.ref_name }}
          releaseBody: Installer is not code-signed (Windows SmartScreen asks to confirm); in-app updates are signature-verified. Bundles FFmpeg 8.1.3 (LGPL-3.0-or-later) as a separate program; source and provenance in the ffmpeg-8.1-lgpl release. See THIRD_PARTY_NOTICES.md.
          releaseDraft: true
          prerelease: false
